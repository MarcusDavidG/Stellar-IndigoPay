name: Load Test Nightly (Workstream 6)

# Performance regression detection for epic #1101, Workstream 6.
#
# Uses scripts/load-test.js (k6) against an environment's BASE_URL, exports the
# k6 summary, and compares every endpoint against the committed
# scripts/load-test-baseline.json using scripts/load-test-compare.js.
#
# Verification (scripts known-green, run in backend jest):
#   - comparison + threshold logic, k6-summary parsing, PR-comment rendering.
#
# The full-load job is intentionally separate from backend CI (it needs k6 and a
# reachable deployment). Merge-blocking is surfaced via the `compare` exit code
# and, for workflow_dispatch, a PR comment.

on:
  schedule:
    # 03:40 UTC nightly — full load against main so the baseline stays fresh.
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      scenario:
        description: "k6 scenario (sustained | pr | ramp-up | token-burst)"
        required: false
        default: "pr"
      base_url:
        description: "Live base URL override (otherwise BASE_URL env secret)"
        required: false
        default: ""
      pr_number:
        description: "Optional PR number to post the comparison as a comment"
        required: false
        default: ""

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  loadtest:
    name: k6 Load + Baseline Compare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: v0.55.0

      - name: Determine target base URL
        id: target
        run: |
          URL="${{ github.event.inputs.base_url || secrets.BASE_URL }}"
          echo "base_url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Will test against: ${URL:-<none — skipping live run>}"

      - name: Run k6 load test
        if: ${{ steps.target.outputs.base_url != '' }}
        env:
          SCENARIO: ${{ github.event.inputs.scenario || 'pr' }}
          BASE_URL: ${{ steps.target.outputs.base_url }}
        run: |
          mkdir -p /tmp/loadtest
          k6 run --summary-export /tmp/loadtest/summary.json \
            scripts/load-test.js \
            > /tmp/loadtest/k6.out 2>&1 || CODE=$?
          echo "--- k6 output (tail) ---"
          tail -40 /tmp/loadtest/k6.out
          echo "k6_exit=${CODE:-0}" >> "$GITHUB_OUTPUT"
          # A k6 failure (hard 500ms gate already enforced in-script) is fatal.
          exit "${CODE:-0}"

      - name: Compare against committed baseline
        id: compare
        if: ${{ always() && steps.target.outputs.base_url != '' }}
        run: |
          set +e
          node scripts/load-test-compare.js \
            --baseline scripts/load-test-baseline.json \
            --current /tmp/loadtest/summary.json \
            --comment-path /tmp/loadtest/comment.md \
            >> /tmp/loadtest/compare.out 2>&1
          CODE=$?
          cat /tmp/loadtest/compare.out
          echo "compare_exit=${CODE}" >> "$GITHUB_OUTPUT"
          echo "blocked=$([ "$CODE" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0 # comparison report is informational; block decision reported below

      - name: Upload load-test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: load-test-artifacts
          path: |
            /tmp/loadtest/*.out
            /tmp/loadtest/summary.json
            /tmp/loadtest/comment.md
          if-no-files-found: ignore

      # Optional: post the comparison as a PR comment when a PR number is given.
      - name: Post PR comparison comment
        if: ${{ always() && inputs.pr_number != '' && steps.target.outputs.base_url != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_FILE: /tmp/loadtest/comment.md
        run: |
          body="$(cat "$COMMENT_FILE")"
          node -e '
            const n = process.env.PR_NUMBER;
            const b = process.env.COMMENT_FILE;
            const fs = require("fs");
            const body = fs.readFileSync(b, "utf8");
            fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/issues/${n}/comments`, {
              method: "POST",
              headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, "Content-Type": "application/json", "X-GitHub-Api-Version": "2022-11-28" },
              body: JSON.stringify({ body }),
            }).then((r) => { if (!r.ok) throw new Error("comment failed: " + r.status); console.log("comment posted"); });
          '

      - name: Fail if a blocking regression is detected
        if: ${{ steps.compare.outputs.blocked == 'true' }}
        run: |
          echo "::error::Load-test detected a merge-blocking performance regression."
          exit 1
