name: Fuzz Nightly (Workstream 4)

# Heavy API-fuzz run for epic #1101, Workstream 4.
#   - Offline: proves the schema-derived generator invariants at high iteration
#     count (every "valid" case is schema-valid, every "invalid" case violates).
#   - Live:   when the BASE_URL secret is configured for an environment it runs
#     the conformance scan ("no 5xx for invalid input; response bodies conform"),
#     posting the JSON report as an artifact. Without BASE_URL the live gate
#     FAILS CLOSED (never silently reports success without sending requests).

on:
  schedule:
    # 04:40 UTC daily — after the daily-baseline load-test run.
    - cron: "40 4 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Invalid iterations per endpoint (offline + live)"
        required: false
        default: "1000"
      base_url:
        description: "Live base URL override (otherwise BASE_URL env secret)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  fuzz:
    name: API Fuzz + OpenAPI Conformance
    runs-on: ubuntu-latest
    # BASE_URL and ITER are promoted to job-level env: GitHub Actions does not
    # allow the `secrets` context in a step-level `if`, but job-level env can
    # hold the secret, and `env` IS available in a step `if`.
    env:
      BASE_URL: ${{ github.event.inputs.base_url || secrets.BASE_URL || '' }}
      ITER: ${{ github.event.inputs.iterations || '1000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (js-yaml for spec loading)
        run: npm ci

      - name: Offline generator self-test (full build)
        id: offline
        run: |
          # ITER is an env value used as data; the CLI validates it is a
          # positive integer before doing any work.
          node scripts/validate-openapi.js --fuzz "$ITER" \
            > reports-offline.txt 2>&1 || CODE=$?
          echo "--- offline report ---"
          tail -30 reports-offline.txt
          echo "offline_exit=${CODE:-0}" >> "$GITHUB_OUTPUT"
          exit "${CODE:-0}"

      - name: Fail closed when no live target is configured
        if: ${{ env.BASE_URL == '' }}
        run: |
          echo "::error::No BASE_URL configured for the live conformance scan. Skipping would report success without sending requests — failing instead. Set the BASE_URL env secret (or pass base_url via workflow_dispatch)."
          exit 1

      - name: Live conformance scan
        id: live
        if: ${{ env.BASE_URL != '' }}
        run: |
          node scripts/validate-openapi.js --live "$BASE_URL" --iterations "$ITER" \
            > reports-live.txt 2>&1 || CODE=$?
          echo "--- live report (tail) ---"
          tail -60 reports-live.txt
          echo "live_exit=${CODE:-0}" >> "$GITHUB_OUTPUT"
          exit "${CODE:-0}"

      - name: Upload fuzz report artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-reports
          path: |
            reports-offline.txt
            reports-live.txt
          if-no-files-found: ignore

      - name: Summarize outcome
        if: ${{ always() }}
        run: |
          echo "offline_exit=${{ steps.offline.outputs.offline_exit || '0' }} live_exit=${{ steps.live.outputs.live_exit || '0' }}"